[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-auto-trading-stm"
version = "0.1.0"
description = "Run-to-completion TradingSTM for the Binance Auto project"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["binance_auto_trader.trading"]

