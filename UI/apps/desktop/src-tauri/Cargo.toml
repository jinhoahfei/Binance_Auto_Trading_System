[package]
name = "binance-auto-trader"
version = "0.1.0"
description = "Binance Auto Trader desktop shell"
authors = ["Binance Auto Trader"]
edition = "2021"
default-run = "binance-auto-trader"
publish = false
license-file = "../../../../LICENSE"

[lib]
name = "binance_auto_trader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "native-picker-current-host-smoke"
path = "src/bin/native_picker_current_host_smoke.rs"
required-features = ["native-picker-smoke"]

[features]
native-picker-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "std"] }
security-framework = "3.7"
