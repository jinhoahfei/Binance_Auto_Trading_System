[package]
name = "binance-auto-trader"
version = "0.1.0"
description = "Binance Auto Trader desktop shell"
authors = ["Binance Auto Trader"]
edition = "2021"
default-run = "binance-auto-trader"
publish = false
license-file = "../../../../LICENSE"

[lib]
name = "binance_auto_trader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "native-picker-current-host-smoke"
path = "src/bin/native_picker_current_host_smoke.rs"
required-features = ["native-picker-smoke"]

[[bin]]
name = "background-liveness-soak"
path = "src/bin/background_liveness_soak.rs"
required-features = ["background-liveness-smoke"]

[features]
native-picker-smoke = []
background-liveness-smoke = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSWindow", "NSWorkspace", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration", "WKPreferences"] }
block2 = "0.6"
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Shell"] }
