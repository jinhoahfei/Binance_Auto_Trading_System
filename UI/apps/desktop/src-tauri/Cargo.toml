[package]
name = "binance-auto-trader"
version = "0.1.0"
description = "Binance Auto Trader desktop shell"
authors = ["Binance Auto Trader"]
edition = "2021"

[lib]
name = "binance_auto_trader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
