[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-auto-trader-backend"
version = "0.1.0"
description = "Integrated RegimeSTM and TradingSTM backend for Binance Auto"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "websocket-client>=1.8,<2",
    "tzdata==2026.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller==6.22.2",
]

[project.scripts]
binance-auto-trader-sidecar = "binance_auto_trader.sidecar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["binance_auto_trader.domain"]
