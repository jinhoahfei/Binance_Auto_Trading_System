[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-auto-trader-backend"
version = "0.1.0"
description = "Integrated RegimeSTM and TradingSTM backend for Binance Auto"
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["binance_auto_trader.domain"]
